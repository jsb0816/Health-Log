spring:
  application:
    name: fit-api

  datasource:
    url: jdbc:mariadb://localhost:3307/fit?serverTimezone=Asia/Seoul
    username: fit
    password: fitpw
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 관리. JPA는 검증만.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5-5
          max-tokens: 4096

  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: Asia/Seoul
